<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | ArchiVault — Records Management & Storage</title>
    <meta name="description" content="We're building something exciting. Subscribe to get notified when this page launches at ArchiVault.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1.0">
    <script>
        (function(){try{if(localStorage.getItem('av-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('av-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();
    </script>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<header class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="ArchiVault Home">
        <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1B3A4B"/><stop offset="100%" stop-color="#2A5470"/></linearGradient></defs>
            <rect width="100" height="100" rx="18" fill="url(#logoBg)"/>
            <rect x="22" y="18" width="36" height="46" rx="3" fill="none" stroke="#D4A843" stroke-width="4"/>
            <path d="M30 30 L50 30 M30 38 L50 38 M30 46 L42 46" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <rect x="42" y="42" width="36" height="46" rx="3" fill="none" stroke="#D4A843" stroke-width="4" opacity="0.6"/>
            <path d="M50 54 L70 54 M50 62 L70 62 M50 70 L62 70" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span class="nav-logo-text">
            <span class="brand-top">Records Management</span>
            <span class="brand-bottom">ArchiVault</span>
        </span>
    </a>
    <div style="display:flex;gap:0.5rem;align-items:center;">
        <button onclick="toggleDir()" class="auth-toggle-btn" id="rtlToggleNav" aria-label="Toggle layout direction / RTL" title="Toggle Direction">
            <span class="dir-indicator dir-label" style="font-size:0.625rem;font-weight:700;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" id="darkToggleNav" aria-label="Toggle dark mode" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>
</header>

<!-- Content -->
<main class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <!-- Ambient radial glow -->
        <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px, 90vw);height:min(450px, 90vw);background:radial-gradient(circle,rgba(212,168,67,0.1),transparent 65%);border-radius:50%;pointer-events:none;"></div>

        <div style="position:relative;z-index:2;">
            <div class="coming-badge">
                <i class="fas fa-rocket"></i> Under Development
            </div>
            <h1 class="coming-title">Coming Soon</h1>
            <p class="coming-desc">
                We're building an enhanced experience with advanced analytics, automated retention workflows, and real-time compliance dashboards. Stay tuned!
            </p>

            <!-- Countdown -->
            <div class="countdown-grid" id="countdown" aria-label="Launch countdown timer">
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-days">30</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-hours">14</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-mins">25</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-secs">00</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>

            <!-- Subscribe Form -->
            <form class="subscribe-form coming-soon-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this page launches.'); this.reset();">
                <input type="email" placeholder="Enter your work email address" aria-label="Email address for notifications" required>
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>

            <!-- Social Links -->
            <div class="coming-socials">
                <a href="https://linkedin.com" target="_blank" rel="noopener" class="coming-social-link" aria-label="LinkedIn" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://twitter.com" target="_blank" rel="noopener" class="coming-social-link" aria-label="X / Twitter" title="X / Twitter"><i class="fab fa-x-twitter"></i></a>
                <a href="https://facebook.com" target="_blank" rel="noopener" class="coming-social-link" aria-label="Facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://youtube.com" target="_blank" rel="noopener" class="coming-social-link" aria-label="YouTube" title="YouTube"><i class="fab fa-youtube"></i></a>
            </div>

            <!-- Quick Action Links -->
            <div style="display:flex;gap:0.75rem;justify-content:center;margin-top:2rem;flex-wrap:wrap;">
                <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> Back to Home</a>
                <a href="services.html" class="btn btn-secondary btn-sm"><i class="fas fa-warehouse"></i> Explore Services</a>
            </div>
        </div>
    </div>
</main>

<script src="components.js"></script>
</body>
</html>
