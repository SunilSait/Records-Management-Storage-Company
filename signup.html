<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ArchiVault — Records Management & Storage</title>
    <meta name="description" content="Create your ArchiVault account to access secure records storage, document retrieval, digital scanning, and compliance management through our client portal.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1.0">
    <script>
        (function(){try{if(localStorage.getItem('av-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('av-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();
    </script>
</head>
<body class="auth-page">

<!-- Top Bar -->
<div class="auth-topbar">
    <div class="auth-topbar-actions" style="display:flex;gap:0.5rem;align-items:center;">
        <button onclick="toggleDir()" class="auth-toggle-btn" id="rtlToggleNav" aria-label="Toggle layout direction / RTL" title="Toggle Direction">
            <span class="dir-indicator dir-label" style="font-size:0.625rem;font-weight:700;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" id="darkToggleNav" aria-label="Toggle dark mode" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>
</div>

<!-- Card -->
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;">
    <div class="auth-card" style="max-width:480px;">
        <!-- Decorative orb -->
        <div class="auth-card-orb" style="top:-60px;left:-60px;"></div>

        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="ArchiVault Home">
            <svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1B3A4B"/><stop offset="100%" stop-color="#2A5470"/></linearGradient></defs>
                <rect width="100" height="100" rx="18" fill="url(#logoBg)"/>
                <rect x="22" y="18" width="36" height="46" rx="3" fill="none" stroke="#D4A843" stroke-width="4"/>
                <path d="M30 30 L50 30 M30 38 L50 38 M30 46 L42 46" stroke="white" stroke-width="3" stroke-linecap="round"/>
                <rect x="42" y="42" width="36" height="46" rx="3" fill="none" stroke="#D4A843" stroke-width="4" opacity="0.6"/>
                <path d="M50 54 L70 54 M50 62 L70 62 M50 70 L62 70" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
            </svg>
            <div class="nav-logo-text">
                <span class="brand-top">Records Management</span>
                <span class="brand-bottom">ArchiVault</span>
            </div>
        </a>

        <!-- Header -->
        <div style="text-align:center;margin-bottom:1.75rem;">
            <h1 style="font-size:1.5rem;margin-bottom:0.375rem;font-weight:700;">Create Account</h1>
            <p style="font-size:0.875rem;color:var(--text-muted);">Get started with secure records management</p>
        </div>

        <!-- Social Signup -->
        <div class="social-login-grid">
            <button type="button" class="social-btn" aria-label="Sign up with Google" title="Sign up with Google">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.9 33.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.2-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.5 18.8 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.8-3.5-11.3-8.3l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.2-2.7-.4-3.9z"/></svg>
            </button>
            <button type="button" class="social-btn" aria-label="Sign up with Apple" title="Sign up with Apple">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.96 4.41-3.74 4.25z"/></svg>
            </button>
            <button type="button" class="social-btn" aria-label="Sign up with Facebook" title="Sign up with Facebook">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07c0 6.02 4.39 11.02 10.13 11.93v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8v8.44C19.61 23.09 24 18.09 24 12.07z"/></svg>
            </button>
        </div>

        <!-- Divider -->
        <div class="divider">or register with work email</div>

        <!-- Form -->
        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" id="signup-form">
            <div class="form-group">
                <label class="form-label" for="signup-fname">First Name</label>
                <input type="text" id="signup-fname" class="form-input form-control" placeholder="Enter your first name" autocomplete="given-name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-lname">Last Name</label>
                <input type="text" id="signup-lname" class="form-input form-control" placeholder="Enter your last name" autocomplete="family-name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-email">Work Email Address</label>
                <input type="email" id="signup-email" class="form-input form-control" placeholder="your@company.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-phone">Phone Number</label>
                <input type="tel" id="signup-phone" class="form-input form-control" placeholder="+1 (555) 019-2834" autocomplete="tel" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-password">Password</label>
                <div class="password-wrapper password-wrap">
                    <input type="password" id="signup-password" class="form-input form-control" placeholder="Create a password (min 8 chars)" minlength="8" autocomplete="new-password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-password', this)" aria-label="Toggle password visibility">
                        <span class="pw-icon"><i class="fas fa-eye"></i></span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-confirm">Confirm Password</label>
                <div class="password-wrapper password-wrap">
                    <input type="password" id="signup-confirm" class="form-input form-control" placeholder="Confirm your password" minlength="8" autocomplete="new-password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-confirm', this)" aria-label="Toggle password visibility">
                        <span class="pw-icon"><i class="fas fa-eye"></i></span>
                    </button>
                </div>
            </div>
            <div class="checkbox-wrapper" style="margin-bottom:1.5rem;display:flex;align-items:center;gap:0.5rem;">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="font-size:0.8125rem;color:var(--text-secondary);">I agree to the <a href="coming-soon.html" class="link-primary">Terms of Service</a> and <a href="coming-soon.html" class="link-primary">Privacy Policy</a></label>
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg">Create Account</button>
        </form>

        <!-- Footer link -->
        <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);">
            Already have an account? <a href="login.html" class="link-primary">Sign In</a>
        </p>
    </div>
</main>

<script src="components.js"></script>
</body>
</html>
